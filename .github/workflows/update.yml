name: Update REED data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch CoreScope metrics
        run: python scripts/update_data.py
      - name: Refresh weekly baseline if needed
        run: python scripts/update_baseline.py
      - name: Commit data files if changed
        run: |
          git add data.json data/relays_history.json data/week_baseline.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CoreScope repeater metrics"
          git push
